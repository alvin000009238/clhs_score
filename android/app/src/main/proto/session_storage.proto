syntax = "proto3";

option java_package = "com.clhs.score.data.proto";
option java_multiple_files = true;

message EncryptedSessionPayload {
  uint32 version = 1;
  uint32 key_version = 2;
  bytes iv = 3;
  bytes ciphertext = 4;
}

message SessionStorage {
  EncryptedSessionPayload general_session = 1;
  EncryptedSessionPayload reminder_session = 2;
  bool legacy_migration_complete = 3;
  bool general_legacy_migration_complete = 4;
  bool reminder_legacy_migration_complete = 5;
}
